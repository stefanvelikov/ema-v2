document.querySelectorAll('a').forEach(link => {
  link.addEventListener('click', function (e) {
    const url = this.getAttribute('href');
    if (!url) return;

    // Check if link is external
    const isExternal = /^https?:\/\//.test(url) && !url.includes(location.hostname);
    if (isExternal) return; // ✅ Skip external links

    e.preventDefault();

    console.log('[CLICK] URL:', url);

    // ✅ Remove .is-active from .global-blur
    const blurEl = document.querySelector('.global-blur');
    if (blurEl) {
      blurEl.classList.remove('is-active');
      console.log('[DOM] .is-active removed from .global-blur');
    }

    fetch(url)
      .then(response => response.text())
      .then(html => {
        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');
        const pageWrapper = doc.querySelector('.page-wrapper');

        if (pageWrapper) {
          pageWrapper.classList.add('second');
          pageWrapper.style.opacity = '0'; // Prepare for fade-in

          setTimeout(() => {
            document.querySelector('.mega-wrap')?.appendChild(pageWrapper);
            console.log('[DOM] .page-wrapper appended with .second');

            // ✅ Animate to visible, then wait 200ms, then redirect
            gsap.to(pageWrapper, {
              opacity: 1,
              duration: 0.2,
              ease: "power2.out",
              onComplete: () => {
                console.log('[ANIMATION] Complete. Waiting 200ms before redirect...');
                setTimeout(() => {
                  console.log('[REDIRECT] Navigating to real page');
                  window.location.href = url;
                }, 200);
              }
            });
          }, 0);
        } else {
          console.warn('[DOM] .page-wrapper not found in fetched page');
        }
      })
      .catch(err => {
        console.error('[FETCH ERROR]', err);
      });
  });
});

<script>

const path = document.querySelector("#motionPathPath");
const plane = document.querySelector(".header104_plane");

const pathLength = path.getTotalLength();
const planeMotion = { progress: 0 };

// Check if the screen width is mobile (you can adjust this threshold as needed)
const isMobile = window.innerWidth <= 768; // Mobile breakpoint (adjust as necessary)

gsap.to(planeMotion, {
  progress: isMobile ? 0.1 : 0.95, // Move half the distance on mobile
  duration: isMobile ? 2 : 4,    // Optionally adjust the duration for mobile
  ease: "power1.inOut",
  onUpdate: () => {
    const length = pathLength * planeMotion.progress;
    const safeLength = Math.min(length, pathLength - 2);
    const point = path.getPointAtLength(safeLength);

    // Custom rotation curve: goes 0 → 30 → 0
    const p = planeMotion.progress;
    const rotation = 30 * Math.sin(p * Math.PI); // 0 at start/end, 30 at middle

    plane.style.transform = `translate(${point.x}px, ${point.y}px) rotate(${rotation}deg)`;
  }
});



</script>


<script>

function initHeader104ScrollAnimation({
  sectionSelector = ".section_header104",

  ctrl = {
    target: ".header104_ctrl-s",
    pathWrapper: ".header104_ctrl-path path",
    pathStart: 0,
    pathEnd: 1,
    scrub: 1,
    autoRotate: true
  },

  flower = {
    target: ".header104_heading-flower-iamge",
    pathWrapper: ".header104_flower-path path",
    pathStart: 0,
    pathEnd: 1,
    scrub: 1,
    autoRotate: false
  }
} = {}) {
  gsap.registerPlugin(ScrollTrigger, MotionPathPlugin);

  const section = document.querySelector(sectionSelector);
  const ctrlPath = document.querySelector(ctrl.pathWrapper);
  const flowerPath = document.querySelector(flower.pathWrapper);

  if (!section || !ctrlPath || !flowerPath) return;

  // Ctrl S animation
  gsap.to(ctrl.target, {
    scrollTrigger: {
      trigger: section,
      start: "top bottom",
      end: "bottom top",
      scrub: ctrl.scrub
    },
    motionPath: {
      path: ctrlPath,
      align: ctrlPath,
      autoRotate: ctrl.autoRotate,
      alignOrigin: [0.5, 0.5],
      start: ctrl.pathStart,
      end: ctrl.pathEnd
    },
    ease: "none"
  });

  // Flower Image animation
  gsap.to(flower.target, {
    scrollTrigger: {
      trigger: section,
      start: "top bottom",
      end: "bottom top",
      scrub: flower.scrub
    },
    motionPath: {
      path: flowerPath,
      align: flowerPath,
      autoRotate: flower.autoRotate,
      alignOrigin: [0.5, 0.5],
      start: flower.pathStart,
      end: flower.pathEnd
    },
    ease: "none"
  });
}


window.addEventListener("DOMContentLoaded", () => {
  initHeader104ScrollAnimation({
    sectionSelector: ".section_header104",

    }
  });
});


</script>

const createScroll01 = () => {
  const panels = Array.from(document.querySelectorAll('.projects_item'));

  panels.forEach((panel, index) => {
    const isLast = index === panels.length - 1;

    const tl = gsap.timeline({
      scrollTrigger: {
        trigger: panel,
        start: 'top 15%',
        scrub: 0.35,
      },
    });

    // Animate panel blur
    tl.to(
      panel,
      {
        ease: 'none',
        startAt: { filter: 'blur(0px)' },
        filter: isLast ? 'none' : 'blur(10px)',
      },
      '<'
    );

    // Animate inner image if not the last panel
    if (!isLast) {
      tl.to(
        panel.querySelector('img'),
        {
          ease: 'power1.in',
          yPercent: -40,
          rotation: index % 2 === 0 ? 20 : -20,
          scale: 1.15,
        },
        '<'
      );
    }
  });
};

document.addEventListener('DOMContentLoaded', () => {
  createScroll01();
});


</script>

// Slightly spread the tags (adjust range if needed)
tagBodies.forEach((body, index) => {
  Matter.Body.setPosition(body, {
    x: body.position.x + (Math.random() * 250 - 25), // spread left/right ±25px
    y: body.position.y - index * 2                 // stagger upward slightly
  });
});


// Add mouse control
var mouse = Mouse.create(render.canvas);
var mouseConstraint = MouseConstraint.create(engine, {
  mouse: mouse,
  constraint: {
    stiffness: 0.2,
    render: { visible: false }
  }
});

World.add(world, mouseConstraint);
render.mouse = mouse;

// Prevent scroll hijacking
mouse.element.removeEventListener("mousewheel", mouse.mousewheel);
mouse.element.removeEventListener("DOMMouseScroll", mouse.mousewheel);

// Click vs drag logic
let click = false;
document.addEventListener('mousedown', () => click = true);
document.addEventListener('mousemove', () => click = false);
document.addEventListener('mouseup', () => console.log(click ? 'click' : 'drag'));

// Handle click on bodies with links
Events.on(mouseConstraint, 'mouseup', function(event) {
  var mouseConstraint = event.source;
  var bodies = engine.world.bodies;
  if (!mouseConstraint.bodyB) {
    for (let i = 0; i < bodies.length; i++) {
      var body = bodies[i];
      if (click && Matter.Bounds.contains(body.bounds, mouseConstraint.mouse.position)) {
        var bodyUrl = body.url;
        if (bodyUrl !== undefined) {
          window.open(bodyUrl, '_blank');
          console.log("Hyperlink was opened");
        }
        break;
      }
    }
  }
});

Engine.run(engine);
