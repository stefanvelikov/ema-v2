</script><script>
gsap.registerPlugin(Draggable, InertiaPlugin);

window.addEventListener("DOMContentLoaded", () => {
  const wrapper = document.querySelector(".gallerydrag");
  const container = document.querySelector(".gallery-container");

  if (!wrapper || !container) {
    console.error("Missing elements.");
    return;
  }

  container.style.pointerEvents = "auto";
  container.style.position = "absolute";
  container.style.top = "0";
  container.style.left = "0";
  container.style.willChange = "transform";

  const original = container.querySelector(".content");
  if (!original) {
    console.error("No .content found inside .gallery-container");
    return;
  }

  const clones = [];
  const gridSize = 3;
  const contentWidth = original.offsetWidth;
  const contentHeight = original.offsetHeight;
  const sampleMedia = container.querySelector(".media");
	const mediaWidth = sampleMedia.offsetWidth;
	const mediaHeight = sampleMedia.offsetHeight;


  for (let row = 0; row < gridSize; row++) {
    for (let col = 0; col < gridSize; col++) {
      const clone = original.cloneNode(true);
      clone.style.position = "absolute";
      clone.style.left = `${col * contentWidth}px`;
      clone.style.top = `${row * contentHeight}px`;
      container.appendChild(clone);
      clones.push(clone);
    }
  }

  original.remove();

  container.style.width = `${contentWidth * gridSize}px`;
  container.style.height = `${contentHeight * gridSize}px`;

  let pos = { x: 0, y: 0 };
  let vx = 0, vy = 0;

  const drag = Draggable.create(container, {
    type: "x,y",
    inertia: true,
    edgeResistance: 0,
    allowContextMenu: true,
    onPress() {
      wrapper.classList.add("active");
    },
    onRelease() {
      wrapper.classList.remove("active");
      drag.update();
    },
    onDrag() {
      pos.x = this.x;
      pos.y = this.y;
    },
    onThrowUpdate() {
      pos.x = this.x;
      pos.y = this.y;
    },
    onDragEnd() {
      pos.x = this.x;
      pos.y = this.y;
      // snapToGrid();
    }
  })[0];

  // ✅ Trackpad inertia
  gsap.ticker.add(() => {
    if (!drag.isPressed && !drag.isDragging) {
      if (Math.abs(vx) > 0.1 || Math.abs(vy) > 0.1) {
        pos.x -= vx;
        pos.y -= vy;
        vx *= 0.4;
        vy *= 0.4;

        const wrappedX = gsap.utils.wrap(-contentWidth * (gridSize - 1), 0, pos.x);
        const wrappedY = gsap.utils.wrap(-contentHeight * (gridSize - 1), 0, pos.y);

        gsap.set(container, { x: wrappedX, y: wrappedY });
        drag.x = wrappedX;
        drag.y = wrappedY;
      } else if (vx !== 0 || vy !== 0) {
        vx = 0;
        vy = 0;
        // snapToGrid();
      }
    }
  });

  // ✅ 2-finger scroll
  wrapper.addEventListener("wheel", (e) => {
    e.preventDefault();
    vx += e.deltaX;
    vy += e.deltaY;
  }, { passive: false });

  // ✅ Resize
  window.addEventListener("resize", () => {
    if (drag && drag.update) drag.update(true);
  });

  // ✅ Entry animation
  gsap.from(".media", {
    scale: 0.5,
    opacity: 0,
    clipPath: "inset(50% 50% 50% 50%)",
    duration: 1.4,
    ease: "expo.out",
    stagger: { amount: 0.3, from: "random" }
  });

  // ✅ Snap to nearest tile
 function snapToGrid() {
  const wrappedX = gsap.utils.wrap(-mediaWidth * 10, 0, pos.x);
  const wrappedY = gsap.utils.wrap(-mediaHeight * 10, 0, pos.y);

  const snapX = Math.round(wrappedX / mediaWidth) * mediaWidth;
  const snapY = Math.round(wrappedY / mediaHeight) * mediaHeight;

  gsap.to(container, {
    x: snapX,
    y: snapY,
    duration: 0.8,
    ease: "expo.out",
    onUpdate() {
      const x = gsap.getProperty(container, "x");
      const y = gsap.getProperty(container, "y");
      drag.x = x;
      drag.y = y;
      pos.x = x;
      pos.y = y;
    }
  });
}


});
